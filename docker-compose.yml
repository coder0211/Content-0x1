# Local stack (OQ-05). `make up` starts infrastructure; `make up-app` also
# builds and runs api + worker containers (profile "app").
name: acs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: acs
      POSTGRES_DB: acs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs -d acs"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Creates the private bucket with versioning (SPEC-02 §7 Backup).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/acs-assets &&
        mc anonymous set none local/acs-assets &&
        mc version enable local/acs-assets &&
        echo "bucket acs-assets ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgres://acs:acs@postgres:5432/acs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mailpit
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile.worker }
    env_file: [.env.example]
    environment:
      WORKER_QUEUES: text,image,maintenance
      DATABASE_URL: postgres://acs:acs@postgres:5432/acs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Video/render queues (ACS-066): ffmpeg + Vietnamese fonts, CPU-bound, so
  # it runs separately from the text/image worker with its own limits.
  render-worker:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile.render }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgres://acs:acs@postgres:5432/acs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mailpit
      WORKER_QUEUES: video,render
    cpus: 2
    mem_limit: 2g
    tmpfs: ["/var/tmp/acs:size=2g"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  miniodata:
