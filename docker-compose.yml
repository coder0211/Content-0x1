# Local stack (OQ-05). `make up` starts infrastructure; `make up-app` also
# builds and runs api + worker containers (profile "app").
name: acs

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: acs
      POSTGRES_PASSWORD: acs
      POSTGRES_DB: acs
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acs -d acs"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible storage. MinIO images are no longer published on public
  # registries, so local dev uses SeaweedFS's S3 gateway on the same port and
  # credentials (the app only speaks plain S3 via minio-go).
  minio:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=9000", "-s3.config=/etc/seaweedfs/s3.json"]
    ports: ["9000:9000"]
    volumes:
      - miniodata:/data
      - ./deploy/local/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 9000"]
      interval: 3s
      timeout: 3s
      retries: 40

  # Creates the private bucket.
  minio-init:
    image: chrislusf/seaweedfs:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        echo "s3.bucket.create -name acs-assets" | weed shell -master=minio:9333 &&
        echo "bucket acs-assets ready"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]

  api:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile.api }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgres://acs:acs@postgres:5432/acs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mailpit
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile.worker }
    env_file: [.env.example]
    environment:
      WORKER_QUEUES: text,image,maintenance
      DATABASE_URL: postgres://acs:acs@postgres:5432/acs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mailpit
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  # Video/render queues (ACS-066): ffmpeg + Vietnamese fonts, CPU-bound, so
  # it runs separately from the text/image worker with its own limits.
  render-worker:
    profiles: [app]
    build: { context: ., dockerfile: deploy/Dockerfile.render }
    env_file: [.env.example]
    environment:
      DATABASE_URL: postgres://acs:acs@postgres:5432/acs?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      SMTP_HOST: mailpit
      WORKER_QUEUES: video,render
    cpus: 2
    mem_limit: 2g
    tmpfs: ["/var/tmp/acs:size=2g"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  redisdata:
  miniodata:
