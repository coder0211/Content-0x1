# sqlc configuration. Each module owns its queries:
#   internal/modules/<m>/adapter/postgres/queries.sql  → generated into the same package.
# To add a module: copy one `sql` entry below, change the two paths and
# nothing else. Regenerate with `make sqlc` (pinned sqlc version, see Makefile).
version: "2"
overrides:
  go:
    rename:
      id: ID
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: UUID
          pointer: true
      - db_type: pg_catalog.numeric
        go_type: github.com/shopspring/decimal.Decimal
      - db_type: pg_catalog.numeric
        nullable: true
        go_type: github.com/shopspring/decimal.NullDecimal
      - db_type: jsonb
        go_type: encoding/json.RawMessage
      - db_type: jsonb
        nullable: true
        go_type: encoding/json.RawMessage
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
      - db_type: citext
        go_type: string
      - db_type: citext
        nullable: true
        go_type:
          type: string
          pointer: true
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/modules/identity/adapter/postgres/queries.sql
    gen:
      go: &gen
        package: postgres
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        omit_unused_structs: true
        emit_empty_slices: true
        out: internal/modules/identity/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/audit/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/audit/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/brand/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/brand/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/budget/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/budget/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/campaign/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/campaign/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/file/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/file/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/job/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/job/adapter/postgres
  - engine: postgresql
    schema: migrations
    queries: internal/modules/provider/adapter/postgres/queries.sql
    gen:
      go:
        <<: *gen
        out: internal/modules/provider/adapter/postgres
