components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: acs_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.next_cursor`.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; same key + same body returns the existing job, different body → 409 IDEMPOTENCY_CONFLICT.
      schema: {type: string, format: uuid}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    PathID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    UUID: {type: string, format: uuid}
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    ListMeta:
      type: object
      required: [request_id, next_cursor]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: number}
        currency: {type: string, example: USD}
        is_estimate: {type: boolean}
    ErrorCode:
      type: string
      description: Machine-readable code; the FE switches on it (SPEC-04 §1.2). Modules may add codes.
      examples:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CSRF_INVALID
        - SELF_APPROVAL_NOT_ALLOWED
        - ACCOUNT_DISABLED
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_NOT_SUPPORTED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - BUDGET_EXCEEDED
        - JOB_BUDGET_EXCEEDED
        - CONCURRENCY_LIMIT
        - PROVIDER_ERROR
        - SERVICE_UNAVAILABLE
        - PRICING_MISSING
        - INTERNAL
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field: {type: string}
        issue: {type: string}
    Error:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, description: "Vietnamese, user-facing"}
            details: {type: array, items: {$ref: "#/components/schemas/ErrorDetail"}}
        meta: {$ref: "#/components/schemas/Meta"}
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        estimated_cost: {$ref: "#/components/schemas/Money"}
    AssetType: {type: string, enum: [content, image, video]}
    AssetStatus: {type: string, enum: [draft, pending_review, changes_requested, approved, archived]}
    AssetFileRole: {type: string, enum: [primary, variant, thumbnail, subtitle, audio, preview]}
    AssetVersionFile:
      type: object
      required: [file_id, role, sort_order, mime_type, kind, url]
      properties:
        file_id: {$ref: "#/components/schemas/UUID"}
        role: {$ref: "#/components/schemas/AssetFileRole"}
        sort_order: {type: integer}
        mime_type: {type: string}
        kind: {type: string, enum: [image, video, audio, document, subtitle]}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        duration_ms: {type: [integer, "null"]}
        url: {type: [string, "null"], description: "Inline preview URL (≤ 15 min). Downloads go through /assets/{id}/download-url."}
    AssetProvenance:
      type: object
      required: [job_id, job_type, provider_code, model_code, prompt_template_code, prompt_template_version, brand_version_id, brand_version_no]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        job_type: {type: string}
        provider_code: {type: [string, "null"]}
        model_code: {type: [string, "null"]}
        prompt_template_code: {type: [string, "null"]}
        prompt_template_version: {type: [integer, "null"]}
        brand_version_id: {type: [string, "null"], format: uuid}
        brand_version_no: {type: [integer, "null"]}
    AssetVersion:
      type: object
      required: [id, version_no, content_json, change_note, generated_by_job_id, created_by, created_by_name, created_at, files, provenance]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version_no: {type: integer}
        content_json: {type: object, description: "Per-type schema (migration 0006): content {title, hook, body_html, body_text, cta, hashtags[], platform, warnings[]}; image {prompt, preset, aspect_ratio, file_ids[]}; video {prompt, preset, aspect_ratio, script, scene_ids[], final_file_id, subtitle_file_id}"}
        change_note: {type: [string, "null"]}
        generated_by_job_id: {type: [string, "null"], format: uuid}
        created_by: {$ref: "#/components/schemas/UUID"}
        created_by_name: {type: string}
        created_at: {type: string, format: date-time}
        files: {type: array, items: {$ref: "#/components/schemas/AssetVersionFile"}}
        provenance: {oneOf: [{$ref: "#/components/schemas/AssetProvenance"}, {type: "null"}]}
    AssetSummary:
      type: object
      required: [id, campaign_id, brand_id, type, subtype, title, status, tags, usage_rights, source_asset_id, created_by, created_by_name, current_version_no, thumbnail_url, submitted_at, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        campaign_id: {type: [string, "null"], format: uuid}
        brand_id: {$ref: "#/components/schemas/UUID"}
        type: {$ref: "#/components/schemas/AssetType"}
        subtype: {type: [string, "null"], example: facebook_post}
        title: {type: string}
        status: {$ref: "#/components/schemas/AssetStatus"}
        tags: {type: array, items: {type: string}}
        usage_rights: {type: [string, "null"], description: "Usage-rights note (music source, reference image licence), FR-AST-06"}
        source_asset_id: {type: [string, "null"], format: uuid}
        created_by: {$ref: "#/components/schemas/UUID"}
        created_by_name: {type: string}
        current_version_no: {type: integer}
        thumbnail_url: {type: [string, "null"], description: "Inline preview of the current version's thumbnail/primary image (image/video only)"}
        submitted_at: {type: [string, "null"], format: date-time, description: "Latest submit-review time"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssetApproval:
      type: object
      required: [id, version_id, version_no, reviewer_id, reviewer_name, decision, comment, checklist, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version_id: {$ref: "#/components/schemas/UUID"}
        version_no: {type: integer}
        reviewer_id: {$ref: "#/components/schemas/UUID", description: "Actor of the decision (the submitter for `submitted`)"}
        reviewer_name: {type: string}
        decision: {type: string, enum: [submitted, approved, changes_requested]}
        comment: {type: [string, "null"]}
        checklist: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    AssetDetail:
      allOf:
        - {$ref: "#/components/schemas/AssetSummary"}
        - type: object
          required: [current_version, approvals, permissions]
          properties:
            current_version: {$ref: "#/components/schemas/AssetVersion"}
            approvals: {type: array, items: {$ref: "#/components/schemas/AssetApproval"}, description: "Review history, newest first"}
            permissions:
              type: object
              description: What the current user may do (FE hides actions; the API still enforces).
              required: [can_edit, can_submit, can_review, can_download]
              properties:
                can_edit: {type: boolean}
                can_submit: {type: boolean}
                can_review: {type: boolean}
                can_download: {type: boolean}
    AssetUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
        usage_rights: {type: [string, "null"], maxLength: 2000}
    AssetVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [content_json, base_version_no]
      properties:
        content_json: {type: object}
        change_note: {type: string, maxLength: 500}
        base_version_no: {type: integer, minimum: 1}
    AssetSubmitReviewRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, maxLength: 2000}
        checklist:
          type: object
          additionalProperties: false
          properties:
            typography_checked: {type: boolean}
    AssetReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, maxLength: 2000, description: "Required for request-changes"}
    AssetDownloadRequest:
      type: object
      additionalProperties: false
      properties:
        file_id: {type: string, format: uuid, description: "Defaults to the current version's primary file"}
    AssetDownloadURL:
      type: object
      required: [url, expires_at, file_id]
      properties:
        url: {type: string}
        expires_at: {type: string, format: date-time}
        file_id: {$ref: "#/components/schemas/UUID"}
    AuditLog:
      type: object
      required: [id, action, resource_type, resource_id, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: [string, "null"], format: uuid}
        actor_email: {type: string}
        action: {type: string, example: budget.update}
        resource_type: {type: string}
        resource_id: {type: string}
        before: {type: [object, "null"]}
        after: {type: [object, "null"]}
        ip: {type: string}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, payload, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        type: {type: string, enum: [job_failed, job_succeeded, review_requested, changes_requested, asset_approved, budget_alert]}
        payload: {type: object}
        read_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    DashboardCampaign:
      type: object
      required: [id, name, status, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        status: {type: string, enum: [draft, in_progress, review, completed, archived]}
        updated_at: {type: string, format: date-time}
    DashboardJob:
      type: object
      required: [id, job_type, status, progress, error_code, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        job_type: {type: string}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress: {type: integer}
        error_code: {type: [string, "null"]}
        created_at: {type: string, format: date-time}
    DashboardSummary:
      type: object
      required: [campaigns, jobs, reviews, cost, generated_at]
      properties:
        campaigns:
          oneOf:
            - type: object
              required: [active_count, recent]
              properties:
                active_count: {type: integer, description: "Campaigns in_progress or review"}
                recent: {type: array, items: {$ref: "#/components/schemas/DashboardCampaign"}, description: "5 most recently updated active campaigns"}
            - type: "null"
        jobs:
          type: object
          required: [scope, queued, running, failed_24h, recent]
          properties:
            scope: {type: string, enum: [own, all]}
            queued: {type: integer}
            running: {type: integer}
            failed_24h: {type: integer}
            recent: {type: array, items: {$ref: "#/components/schemas/DashboardJob"}, description: "Up to 5 running or recently failed jobs"}
        reviews:
          type: object
          required: [pending_review, my_pending_review, my_changes_requested, my_drafts]
          properties:
            pending_review: {type: [integer, "null"], description: "Whole queue size (asset.review only)"}
            my_pending_review: {type: integer}
            my_changes_requested: {type: integer}
            my_drafts: {type: integer}
        cost:
          oneOf:
            - type: object
              required: [currency, today, month, monthly_limit, month_used_pct]
              properties:
                currency: {type: string, example: USD}
                today: {type: number}
                month: {type: number}
                monthly_limit: {type: [number, "null"]}
                month_used_pct: {type: [number, "null"]}
            - type: "null"
        generated_at: {type: string, format: date-time}
    UploadPurpose:
      type: string
      enum: [brand_logo, reference_image, image_mask, video_source, music, document]
    FileKind: {type: string, enum: [image, video, audio, subtitle, document, other]}
    File:
      type: object
      required: [id, mime_type, size_bytes, kind, upload_status, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        kind: {$ref: "#/components/schemas/FileKind"}
        upload_status: {type: string, enum: [pending, ready, rejected]}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        duration_ms: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        url: {type: [string, "null"], description: Signed GET URL (≤ 15 min)}
        url_expires_at: {type: [string, "null"], format: date-time}
    RoleCode: {type: string, enum: [admin, marketing_lead, content_creator, reviewer]}
    Permission:
      type: string
      enum: [user.manage, provider.manage, provider.view, budget.manage, brand.manage, brand.view, campaign.manage, generate.run, asset.review, asset.download, usage.view, audit.view]
    UserStatus: {type: string, enum: [active, locked, disabled]}
    Me:
      type: object
      required: [id, email, name, roles, permissions]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        email: {type: string}
        name: {type: string}
        roles: {type: array, items: {$ref: "#/components/schemas/RoleCode"}}
        permissions: {type: array, items: {$ref: "#/components/schemas/Permission"}}
    User:
      type: object
      required: [id, email, name, status, roles, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        email: {type: string}
        name: {type: string}
        status: {$ref: "#/components/schemas/UserStatus"}
        roles: {type: array, items: {$ref: "#/components/schemas/RoleCode"}}
        locked_until: {type: [string, "null"], format: date-time}
        last_login_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
  responses:
    NoContent:
      description: No content
    BadRequest:
      description: VALIDATION_FAILED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: UNAUTHENTICATED / SESSION_EXPIRED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: FORBIDDEN / CSRF_INVALID
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: NOT_FOUND
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Conflict (INVALID_STATE_TRANSITION, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, CONFLICT)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    PayloadTooLarge:
      description: FILE_TOO_LARGE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unprocessable:
      description: CAPABILITY_NOT_SUPPORTED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Locked:
      description: ACCOUNT_LOCKED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooManyRequests:
      description: RATE_LIMITED / BUDGET_EXCEEDED / JOB_BUDGET_EXCEEDED / CONCURRENCY_LIMIT
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE / PRICING_MISSING
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
