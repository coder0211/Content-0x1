    post:
      tags: [videos]
      operationId: createVideo
      summary: Create a video asset + project and start job video_storyboard (script → storyboard)
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/VideoCreateRequest"}
      responses:
        "202":
          description: Storyboard job accepted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoJobAccepted"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /videos/{id}:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    get:
      tags: [videos]
      operationId: getVideo
      summary: Project with settings, scenes (signed preview URLs ≤ 15 min), latest output and current job
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoProject"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /videos/{id}/scenes:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    put:
      tags: [videos]
      operationId: saveVideoScenes
      summary: Replace the storyboard (add / remove / reorder / edit) within OQ-07 limits
      description: >-
        ≤ 10 scenes, 2–8 s each, total ≤ 60 s. Scenes whose picture changes (visual prompt, duration, source image) go back to draft and lose their clip. 409 VIDEO_JOB_IN_PROGRESS while a job runs.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [scenes]
              properties:
                scenes: {type: array, maxItems: 10, items: {$ref: "#/components/schemas/VideoSceneInput"}}
      responses:
        "200":
          description: Saved project
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoProject"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /videos/{id}/estimate:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    post:
      tags: [videos]
      operationId: estimateVideo
      summary: Cost estimate of producing the current storyboard (no job is created)
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200":
          description: Estimate with breakdown, limits and storyboard violations
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoEstimate"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /videos/{id}/productions:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    post:
      tags: [videos]
      operationId: produceVideo
      summary: Start job video_production for every scene not ready yet (budget gate; override Lead/Admin only, audited)
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                budget_override: {type: boolean, default: false}
      responses:
        "202":
          description: Production job accepted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoJobAccepted"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /videos/{id}/scenes/{sceneId}/regenerations:
    parameters:
      - {$ref: "#/components/parameters/PathID"}
      - {name: sceneId, in: path, required: true, schema: {$ref: "#/components/schemas/UUID"}}
    post:
      tags: [videos]
      operationId: regenerateVideoScene
      summary: Job video_scene_regenerate — regenerate one scene (optional new visual prompt) and re-render, reusing other clips
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                visual_prompt: {type: [string, "null"], maxLength: 1000}
                budget_override: {type: boolean, default: false}
      responses:
        "202":
          description: Regeneration job accepted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoJobAccepted"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /videos/{id}/renders:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    post:
      tags: [videos]
      operationId: rerenderVideo
      summary: Job video_render — render again (e.g. new music/subtitles) without generating scenes
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                voiceover: {$ref: "#/components/schemas/VideoVoiceover"}
                subtitles: {$ref: "#/components/schemas/VideoSubtitles"}
                music: {$ref: "#/components/schemas/VideoMusic"}
                budget_override: {type: boolean, default: false}
      responses:
        "202":
          description: Render job accepted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/VideoJobAccepted"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: acs_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.next_cursor`.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; same key + same body returns the existing job, different body → 409 IDEMPOTENCY_CONFLICT.
      schema: {type: string, format: uuid}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    PathID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    UUID: {type: string, format: uuid}
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    ListMeta:
      type: object
      required: [request_id, next_cursor]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: number}
        currency: {type: string, example: USD}
        is_estimate: {type: boolean}
    ErrorCode:
      type: string
      description: Machine-readable code; the FE switches on it (SPEC-04 §1.2). Modules may add codes.
      examples:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CSRF_INVALID
        - SELF_APPROVAL_NOT_ALLOWED
        - ACCOUNT_DISABLED
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_NOT_SUPPORTED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - BUDGET_EXCEEDED
        - JOB_BUDGET_EXCEEDED
        - CONCURRENCY_LIMIT
        - PROVIDER_ERROR
        - SERVICE_UNAVAILABLE
        - PRICING_MISSING
        - INTERNAL
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field: {type: string}
        issue: {type: string}
    Error:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, description: "Vietnamese, user-facing"}
            details: {type: array, items: {$ref: "#/components/schemas/ErrorDetail"}}
        meta: {$ref: "#/components/schemas/Meta"}
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        estimated_cost: {$ref: "#/components/schemas/Money"}
    AssetType: {type: string, enum: [content, image, video]}
    AssetStatus: {type: string, enum: [draft, pending_review, changes_requested, approved, archived]}
    AssetFileRole: {type: string, enum: [primary, variant, thumbnail, subtitle, audio, preview]}
    AssetVersionFile:
      type: object
      required: [file_id, role, sort_order, mime_type, kind, url]
      properties:
        file_id: {$ref: "#/components/schemas/UUID"}
        role: {$ref: "#/components/schemas/AssetFileRole"}
        sort_order: {type: integer}
        mime_type: {type: string}
        kind: {type: string, enum: [image, video, audio, document, subtitle]}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        duration_ms: {type: [integer, "null"]}
        url: {type: [string, "null"], description: "Inline preview URL (≤ 15 min). Downloads go through /assets/{id}/download-url."}
    AssetProvenance:
      type: object
      required: [job_id, job_type, provider_code, model_code, prompt_template_code, prompt_template_version, brand_version_id, brand_version_no]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        job_type: {type: string}
        provider_code: {type: [string, "null"]}
        model_code: {type: [string, "null"]}
        prompt_template_code: {type: [string, "null"]}
        prompt_template_version: {type: [integer, "null"]}
        brand_version_id: {type: [string, "null"], format: uuid}
        brand_version_no: {type: [integer, "null"]}
    AssetVersion:
      type: object
      required: [id, version_no, content_json, change_note, generated_by_job_id, created_by, created_by_name, created_at, files, provenance]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version_no: {type: integer}
        content_json: {type: object, description: "Per-type schema (migration 0006): content {title, hook, body_html, body_text, cta, hashtags[], platform, warnings[]}; image {prompt, preset, aspect_ratio, file_ids[]}; video {prompt, preset, aspect_ratio, script, scene_ids[], final_file_id, subtitle_file_id}"}
        change_note: {type: [string, "null"]}
        generated_by_job_id: {type: [string, "null"], format: uuid}
        created_by: {$ref: "#/components/schemas/UUID"}
        created_by_name: {type: string}
        created_at: {type: string, format: date-time}
        files: {type: array, items: {$ref: "#/components/schemas/AssetVersionFile"}}
        provenance: {oneOf: [{$ref: "#/components/schemas/AssetProvenance"}, {type: "null"}]}
    AssetSummary:
      type: object
      required: [id, campaign_id, brand_id, type, subtype, title, status, tags, usage_rights, source_asset_id, created_by, created_by_name, current_version_no, thumbnail_url, submitted_at, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        campaign_id: {type: [string, "null"], format: uuid}
        brand_id: {$ref: "#/components/schemas/UUID"}
        type: {$ref: "#/components/schemas/AssetType"}
        subtype: {type: [string, "null"], example: facebook_post}
        title: {type: string}
        status: {$ref: "#/components/schemas/AssetStatus"}
        tags: {type: array, items: {type: string}}
        usage_rights: {type: [string, "null"], description: "Usage-rights note (music source, reference image licence), FR-AST-06"}
        source_asset_id: {type: [string, "null"], format: uuid}
        created_by: {$ref: "#/components/schemas/UUID"}
        created_by_name: {type: string}
        current_version_no: {type: integer}
        thumbnail_url: {type: [string, "null"], description: "Inline preview of the current version's thumbnail/primary image (image/video only)"}
        submitted_at: {type: [string, "null"], format: date-time, description: "Latest submit-review time"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    AssetApproval:
      type: object
      required: [id, version_id, version_no, reviewer_id, reviewer_name, decision, comment, checklist, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version_id: {$ref: "#/components/schemas/UUID"}
        version_no: {type: integer}
        reviewer_id: {$ref: "#/components/schemas/UUID", description: "Actor of the decision (the submitter for `submitted`)"}
        reviewer_name: {type: string}
        decision: {type: string, enum: [submitted, approved, changes_requested]}
        comment: {type: [string, "null"]}
        checklist: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    AssetDetail:
      allOf:
        - {$ref: "#/components/schemas/AssetSummary"}
        - type: object
          required: [current_version, approvals, permissions]
          properties:
            current_version: {$ref: "#/components/schemas/AssetVersion"}
            approvals: {type: array, items: {$ref: "#/components/schemas/AssetApproval"}, description: "Review history, newest first"}
            permissions:
              type: object
              description: What the current user may do (FE hides actions; the API still enforces).
              required: [can_edit, can_submit, can_review, can_download]
              properties:
                can_edit: {type: boolean}
                can_submit: {type: boolean}
                can_review: {type: boolean}
                can_download: {type: boolean}
    AssetUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        title: {type: string, minLength: 1, maxLength: 200}
        tags: {type: array, maxItems: 20, items: {type: string, maxLength: 50}}
        usage_rights: {type: [string, "null"], maxLength: 2000}
    AssetVersionCreateRequest:
      type: object
      additionalProperties: false
      required: [content_json, base_version_no]
      properties:
        content_json: {type: object}
        change_note: {type: string, maxLength: 500}
        base_version_no: {type: integer, minimum: 1}
    AssetSubmitReviewRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, maxLength: 2000}
        checklist:
          type: object
          additionalProperties: false
          properties:
            typography_checked: {type: boolean}
    AssetReviewDecisionRequest:
      type: object
      additionalProperties: false
      properties:
        comment: {type: string, maxLength: 2000, description: "Required for request-changes"}
    AssetDownloadRequest:
      type: object
      additionalProperties: false
      properties:
        file_id: {type: string, format: uuid, description: "Defaults to the current version's primary file"}
    AssetDownloadURL:
      type: object
      required: [url, expires_at, file_id]
      properties:
        url: {type: string}
        expires_at: {type: string, format: date-time}
        file_id: {$ref: "#/components/schemas/UUID"}
    AuditLog:
      type: object
      required: [id, action, resource_type, resource_id, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: [string, "null"], format: uuid}
        actor_email: {type: string}
        action: {type: string, example: budget.update}
        resource_type: {type: string}
        resource_id: {type: string}
        before: {type: [object, "null"]}
        after: {type: [object, "null"]}
        ip: {type: string}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, payload, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        type: {type: string, enum: [job_failed, job_succeeded, review_requested, changes_requested, asset_approved, budget_alert]}
        payload: {type: object}
        read_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    BrandColor:
      type: object
      required: [name, hex]
      properties:
        name: {type: string}
        hex: {type: string, pattern: "^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$"}
    BrandPersona:
      type: object
      required: [name]
      properties:
        name: {type: string}
        pain_points: {type: array, items: {type: string}}
        motivations: {type: array, items: {type: string}}
    BrandProfile:
      type: object
      additionalProperties: false
      properties:
        description: {type: string}
        colors: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/BrandColor"}}
        typography:
          type: object
          properties:
            heading: {type: string}
            body: {type: string}
        tone_of_voice: {type: array, items: {type: string}}
        preferred_words: {type: array, items: {type: string}}
        forbidden_words: {type: array, items: {type: string}}
        default_ctas: {type: array, items: {type: string}}
        audience_personas: {type: array, items: {$ref: "#/components/schemas/BrandPersona"}}
        notes: {type: string}
    BrandVersion:
      type: object
      required: [id, version_no, profile, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version_no: {type: integer}
        profile: {$ref: "#/components/schemas/BrandProfile"}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    Brand:
      type: object
      required: [id, name, current_version, created_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        current_version: {$ref: "#/components/schemas/BrandVersion"}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProductOffer:
      type: object
      required: [text]
      properties:
        text: {type: string}
        valid_from: {type: [string, "null"], format: date}
        valid_to: {type: [string, "null"], format: date}
        status:
          type: string
          enum: [active, expired, upcoming]
          description: Response only. Expired offers are never sent to prompts.
    ProductProof:
      type: object
      required: [text]
      properties:
        type: {type: string, enum: [testimonial, statistic, award, certification, media, other]}
        text: {type: string}
        source: {type: string}
        verified: {type: boolean, description: Only verified proof reaches prompts.}
    ProductFacts:
      type: object
      properties:
        usp: {type: array, items: {type: string}}
        price:
          type: [object, "null"]
          properties:
            amount: {type: number}
            currency: {type: string, minLength: 3, maxLength: 3}
            note: {type: string}
        offers: {type: array, items: {$ref: "#/components/schemas/ProductOffer"}}
        policies: {type: array, items: {type: string}}
        proof: {type: array, items: {$ref: "#/components/schemas/ProductProof"}}
    ProductInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 200}
        description: {type: string}
        facts: {$ref: "#/components/schemas/ProductFacts"}
        status: {type: string, enum: [active, archived]}
    Product:
      type: object
      required: [id, brand_id, name, description, facts, status, created_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        brand_id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        description: {type: string}
        facts: {$ref: "#/components/schemas/ProductFacts"}
        status: {type: string, enum: [active, archived]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BrandAssetType:
      type: string
      enum: [logo, reference_image, font, document, sample_content, music]
    BrandMusicLicense:
      type: object
      required: [source, license_type]
      properties:
        source: {type: string}
        license_type: {type: string}
        expires_at: {type: string, format: date}
        attribution: {type: string}
        notes: {type: string}
    BrandAsset:
      type: object
      required: [id, brand_id, file_id, asset_type, label, license, license_valid, file, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        brand_id: {$ref: "#/components/schemas/UUID"}
        file_id: {$ref: "#/components/schemas/UUID"}
        asset_type: {$ref: "#/components/schemas/BrandAssetType"}
        label: {type: string}
        license:
          oneOf:
            - {$ref: "#/components/schemas/BrandMusicLicense"}
            - {type: "null"}
        license_valid: {type: boolean, description: Complete and unexpired license (music usable in videos).}
        file:
          type: [object, "null"]
          properties:
            mime_type: {type: string}
            original_name: {type: string}
            size_bytes: {type: integer}
            width: {type: integer}
            height: {type: integer}
            duration_ms: {type: integer}
            url: {type: [string, "null"]}
            url_expires_at: {type: [string, "null"], format: date-time}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    BudgetEstimateRequest:
      type: object
      required: [kind]
      properties:
        kind: {type: string, enum: [text, image, video]}
        provider: {type: string, description: "Empty → default model of the kind"}
        model: {type: string}
        campaign_id: {type: [string, "null"], format: uuid}
        prompt_chars: {type: integer, minimum: 0, description: "text: prompt length in characters"}
        max_output_tokens: {type: integer, minimum: 0}
        count: {type: integer, minimum: 1, maximum: 8, description: "image: number of images"}
        size: {type: string, example: "1024"}
        quality: {type: string, enum: [standard, high]}
        clip_seconds: {type: number, minimum: 0, description: "video: total generated clip seconds"}
        resolution: {type: string, enum: [720p, 1080p]}
