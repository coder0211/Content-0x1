      in: header
      required: true
      schema: {type: string}
    PathID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    UUID: {type: string, format: uuid}
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    ListMeta:
      type: object
      required: [request_id, next_cursor]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: number}
        currency: {type: string, example: USD}
        is_estimate: {type: boolean}
    ErrorCode:
      type: string
      description: Machine-readable code; the FE switches on it (SPEC-04 §1.2). Modules may add codes.
      examples:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CSRF_INVALID
        - SELF_APPROVAL_NOT_ALLOWED
        - ACCOUNT_DISABLED
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_NOT_SUPPORTED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - BUDGET_EXCEEDED
        - JOB_BUDGET_EXCEEDED
        - CONCURRENCY_LIMIT
        - PROVIDER_ERROR
        - SERVICE_UNAVAILABLE
        - PRICING_MISSING
        - INTERNAL
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field: {type: string}
        issue: {type: string}
    Error:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, description: "Vietnamese, user-facing"}
            details: {type: array, items: {$ref: "#/components/schemas/ErrorDetail"}}
        meta: {$ref: "#/components/schemas/Meta"}
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        estimated_cost: {$ref: "#/components/schemas/Money"}
    AuditLog:
      type: object
      required: [id, action, resource_type, resource_id, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: [string, "null"], format: uuid}
        actor_email: {type: string}
        action: {type: string, example: budget.update}
        resource_type: {type: string}
        resource_id: {type: string}
        before: {type: [object, "null"]}
        after: {type: [object, "null"]}
        ip: {type: string}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, payload, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        type: {type: string, enum: [job_failed, job_succeeded, review_requested, changes_requested, asset_approved, budget_alert]}
        payload: {type: object}
        read_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    UploadPurpose:
      type: string
      enum: [brand_logo, reference_image, image_mask, video_source, music, document]
    FileKind: {type: string, enum: [image, video, audio, subtitle, document, other]}
    File:
      type: object
      required: [id, mime_type, size_bytes, kind, upload_status, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        kind: {$ref: "#/components/schemas/FileKind"}
        upload_status: {type: string, enum: [pending, ready, rejected]}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        duration_ms: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        url: {type: [string, "null"], description: Signed GET URL (≤ 15 min)}
        url_expires_at: {type: [string, "null"], format: date-time}
    RoleCode: {type: string, enum: [admin, marketing_lead, content_creator, reviewer]}
    Permission:
      type: string
      enum: [user.manage, provider.manage, provider.view, budget.manage, brand.manage, brand.view, campaign.manage, generate.run, asset.review, asset.download, usage.view, audit.view]
    UserStatus: {type: string, enum: [active, locked, disabled]}
    Me:
      type: object
      required: [id, email, name, roles, permissions]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        email: {type: string}
        name: {type: string}
        roles: {type: array, items: {$ref: "#/components/schemas/RoleCode"}}
        permissions: {type: array, items: {$ref: "#/components/schemas/Permission"}}
    User:
      type: object
      required: [id, email, name, status, roles, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        email: {type: string}
        name: {type: string}
        status: {$ref: "#/components/schemas/UserStatus"}
        roles: {type: array, items: {$ref: "#/components/schemas/RoleCode"}}
        locked_until: {type: [string, "null"], format: date-time}
        last_login_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    AIKind: {type: string, enum: [text, image, video, voice]}
    AIProviderStatus: {type: string, enum: [active, disabled]}
    AIModelStatus: {type: string, enum: [active, disabled]}
    PromptTemplateStatus: {type: string, enum: [draft, active, retired]}
    AICapabilities:
      type: object
      additionalProperties: true
      description: "Model capability map (ports.Capabilities), e.g. aspect_ratios, sizes, max_duration_sec, voices, structured_output"
    AIProvider:
      type: object
      required: [id, code, name, kinds, status, secret_ref, secret_configured, adapter_available, config_json, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        code: {type: string, example: anthropic}
        name: {type: string}
        kinds: {type: array, items: {$ref: "#/components/schemas/AIKind"}}
        status: {$ref: "#/components/schemas/AIProviderStatus"}
        secret_ref: {type: string}
        secret_configured: {type: boolean}
        adapter_available: {type: boolean}
        config_json: {type: object, additionalProperties: true}
        updated_at: {type: string, format: date-time}
    AIModel:
      type: object
      required: [id, provider_id, provider_code, provider_status, model_code, kind, capabilities, concurrency_limit, is_default, status, adapter_available, usable]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        provider_id: {$ref: "#/components/schemas/UUID"}
        provider_code: {type: string}
        provider_status: {$ref: "#/components/schemas/AIProviderStatus"}
        model_code: {type: string}
        kind: {$ref: "#/components/schemas/AIKind"}
        capabilities: {$ref: "#/components/schemas/AICapabilities"}
        concurrency_limit: {type: integer}
        is_default: {type: boolean}
        status: {$ref: "#/components/schemas/AIModelStatus"}
        adapter_available: {type: boolean}
        usable: {type: boolean}
    AIPriceItem:
      type: object
      required: [unit, unit_price]
      properties:
        unit: {type: string, example: input_token}
        unit_price: {type: string, description: "Decimal as string", example: "0.000003"}
    AIPricingVersion:
      type: object
      required: [pricing_version, currency, effective_from, effective_to, is_current, items]
      properties:
        pricing_version: {type: string}
        currency: {type: string}
        effective_from: {type: string, format: date-time}
        effective_to: {type: [string, "null"], format: date-time}
        is_current: {type: boolean}
        items: {type: array, items: {$ref: "#/components/schemas/AIPriceItem"}}
    PromptTemplate:
      type: object
      required: [id, code, version, status, system_prompt, user_template, output_schema, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        code: {type: string}
        version: {type: integer}
        status: {$ref: "#/components/schemas/PromptTemplateStatus"}
        system_prompt: {type: string}
        user_template: {type: string}
        output_schema: {type: [object, "null"], additionalProperties: true}
        created_by: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        created_at: {type: string, format: date-time}
  responses:
    NoContent:
      description: No content
    BadRequest:
      description: VALIDATION_FAILED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: UNAUTHENTICATED / SESSION_EXPIRED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: FORBIDDEN / CSRF_INVALID
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: NOT_FOUND
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Conflict (INVALID_STATE_TRANSITION, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, CONFLICT)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    PayloadTooLarge:
      description: FILE_TOO_LARGE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unprocessable:
      description: CAPABILITY_NOT_SUPPORTED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Locked:
      description: ACCOUNT_LOCKED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooManyRequests:
      description: RATE_LIMITED / BUDGET_EXCEEDED / JOB_BUDGET_EXCEEDED / CONCURRENCY_LIMIT
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE / PRICING_MISSING
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
