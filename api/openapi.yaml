      tags: [auth]
      operationId: getMe
      summary: Current user, roles and effective permissions
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/Me"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List users (user.manage)
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - {name: q, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {$ref: "#/components/schemas/UserStatus"}}
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/User"}}
                  meta: {$ref: "#/components/schemas/ListMeta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
    post:
      tags: [users]
      operationId: createUser
      summary: Create a user with a temporary password (user.manage, audited)
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, name, role_codes, temp_password]
              properties:
                email: {type: string, format: email}
                name: {type: string}
                role_codes: {type: array, minItems: 1, items: {$ref: "#/components/schemas/RoleCode"}}
                temp_password: {type: string, minLength: 10}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/User"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "409": {$ref: "#/components/responses/Conflict"}
  /users/{id}:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    get:
      tags: [users]
      operationId: getUser
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/User"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update name/status/roles; locking or disabling revokes all sessions (audited)
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string}
                status: {$ref: "#/components/schemas/UserStatus"}
                role_codes: {type: array, minItems: 1, items: {$ref: "#/components/schemas/RoleCode"}}
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/User"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: acs_session
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `meta.next_cursor`.
      schema: {type: string}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID; same key + same body returns the existing job, different body → 409 IDEMPOTENCY_CONFLICT.
      schema: {type: string, format: uuid}
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    PathID:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    UUID: {type: string, format: uuid}
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    ListMeta:
      type: object
      required: [request_id, next_cursor]
      properties:
        request_id: {type: string}
        next_cursor: {type: [string, "null"]}
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: {type: number}
        currency: {type: string, example: USD}
        is_estimate: {type: boolean}
    ErrorCode:
      type: string
      description: Machine-readable code; the FE switches on it (SPEC-04 §1.2). Modules may add codes.
      examples:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - SESSION_EXPIRED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - CSRF_INVALID
        - SELF_APPROVAL_NOT_ALLOWED
        - ACCOUNT_DISABLED
        - NOT_FOUND
        - CONFLICT
        - INVALID_STATE_TRANSITION
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_KEY_REQUIRED
        - VERSION_CONFLICT
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - CAPABILITY_NOT_SUPPORTED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - BUDGET_EXCEEDED
        - JOB_BUDGET_EXCEEDED
        - CONCURRENCY_LIMIT
        - PROVIDER_ERROR
        - SERVICE_UNAVAILABLE
        - PRICING_MISSING
        - INTERNAL
    ErrorDetail:
      type: object
      additionalProperties: true
      properties:
        field: {type: string}
        issue: {type: string}
    Error:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: {$ref: "#/components/schemas/ErrorCode"}
            message: {type: string, description: "Vietnamese, user-facing"}
            details: {type: array, items: {$ref: "#/components/schemas/ErrorDetail"}}
        meta: {$ref: "#/components/schemas/Meta"}
    JobAccepted:
      type: object
      required: [job_id, status]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        estimated_cost: {$ref: "#/components/schemas/Money"}
    AuditLog:
      type: object
      required: [id, action, resource_type, resource_id, created_at]
      properties:
        id: {type: integer}
        actor_id: {type: [string, "null"], format: uuid}
        actor_email: {type: string}
        action: {type: string, example: budget.update}
        resource_type: {type: string}
        resource_id: {type: string}
        before: {type: [object, "null"]}
        after: {type: [object, "null"]}
        ip: {type: string}
        request_id: {type: string}
        created_at: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, type, payload, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        type: {type: string, enum: [job_failed, job_succeeded, review_requested, changes_requested, asset_approved, budget_alert]}
        payload: {type: object}
        read_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
    BrandColor:
      type: object
      required: [name, hex]
      properties:
        name: {type: string}
        hex: {type: string, pattern: "^#([0-9A-Fa-f]{3}|[0-9A-Fa-f]{6})$"}
    BrandPersona:
      type: object
      required: [name]
      properties:
        name: {type: string}
        pain_points: {type: array, items: {type: string}}
        motivations: {type: array, items: {type: string}}
    BrandProfile:
      type: object
      additionalProperties: false
      properties:
        description: {type: string}
        colors: {type: array, maxItems: 20, items: {$ref: "#/components/schemas/BrandColor"}}
        typography:
          type: object
          properties:
            heading: {type: string}
            body: {type: string}
        tone_of_voice: {type: array, items: {type: string}}
        preferred_words: {type: array, items: {type: string}}
        forbidden_words: {type: array, items: {type: string}}
        default_ctas: {type: array, items: {type: string}}
        audience_personas: {type: array, items: {$ref: "#/components/schemas/BrandPersona"}}
        notes: {type: string}
    BrandVersion:
      type: object
      required: [id, version_no, profile, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        version_no: {type: integer}
        profile: {$ref: "#/components/schemas/BrandProfile"}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    Brand:
      type: object
      required: [id, name, current_version, created_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        current_version: {$ref: "#/components/schemas/BrandVersion"}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProductOffer:
      type: object
      required: [text]
      properties:
        text: {type: string}
        valid_from: {type: [string, "null"], format: date}
        valid_to: {type: [string, "null"], format: date}
        status:
          type: string
          enum: [active, expired, upcoming]
          description: Response only. Expired offers are never sent to prompts.
    ProductProof:
      type: object
      required: [text]
      properties:
        type: {type: string, enum: [testimonial, statistic, award, certification, media, other]}
        text: {type: string}
        source: {type: string}
        verified: {type: boolean, description: Only verified proof reaches prompts.}
    ProductFacts:
      type: object
      properties:
        usp: {type: array, items: {type: string}}
        price:
          type: [object, "null"]
          properties:
            amount: {type: number}
            currency: {type: string, minLength: 3, maxLength: 3}
            note: {type: string}
        offers: {type: array, items: {$ref: "#/components/schemas/ProductOffer"}}
        policies: {type: array, items: {type: string}}
        proof: {type: array, items: {$ref: "#/components/schemas/ProductProof"}}
    ProductInput:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, maxLength: 200}
        description: {type: string}
        facts: {$ref: "#/components/schemas/ProductFacts"}
        status: {type: string, enum: [active, archived]}
    Product:
      type: object
      required: [id, brand_id, name, description, facts, status, created_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        brand_id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        description: {type: string}
        facts: {$ref: "#/components/schemas/ProductFacts"}
        status: {type: string, enum: [active, archived]}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    BrandAssetType:
      type: string
      enum: [logo, reference_image, font, document, sample_content, music]
    BrandMusicLicense:
      type: object
      required: [source, license_type]
      properties:
        source: {type: string}
        license_type: {type: string}
        expires_at: {type: string, format: date}
        attribution: {type: string}
        notes: {type: string}
    BrandAsset:
      type: object
      required: [id, brand_id, file_id, asset_type, label, license, license_valid, file, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        brand_id: {$ref: "#/components/schemas/UUID"}
        file_id: {$ref: "#/components/schemas/UUID"}
        asset_type: {$ref: "#/components/schemas/BrandAssetType"}
        label: {type: string}
        license:
          oneOf:
            - {$ref: "#/components/schemas/BrandMusicLicense"}
            - {type: "null"}
        license_valid: {type: boolean, description: Complete and unexpired license (music usable in videos).}
        file:
          type: [object, "null"]
          properties:
            mime_type: {type: string}
            original_name: {type: string}
            size_bytes: {type: integer}
            width: {type: integer}
            height: {type: integer}
            duration_ms: {type: integer}
            url: {type: [string, "null"]}
            url_expires_at: {type: [string, "null"], format: date-time}
        created_by: {type: [string, "null"], format: uuid}
        created_at: {type: string, format: date-time}
    CampaignStatus:
      type: string
      enum: [draft, in_progress, review, completed, archived]
    CampaignGoal:
      type: string
      enum: [awareness, engagement, lead, conversion]
    CampaignFormat:
      type: object
      required: [type, count]
      properties:
        type: {type: string, pattern: "^[a-z0-9_]{1,40}$", description: "e.g. facebook_post, poster, short_video"}
        count: {type: integer, minimum: 1, maximum: 50}
    CampaignBrief:
      type: object
      additionalProperties: false
      required: [target_audience, key_message, channels, formats, deadline]
      properties:
        product_ids: {type: array, items: {$ref: "#/components/schemas/UUID"}}
        target_audience: {type: string}
        key_message: {type: string}
        verified_offer: {type: string}
        channels: {type: array, minItems: 1, items: {type: string, pattern: "^[a-z0-9_]{1,40}$"}}
        formats: {type: array, minItems: 1, items: {$ref: "#/components/schemas/CampaignFormat"}}
        deadline: {type: string, format: date}
        notes: {type: string}
    CampaignPlanItem:
      type: object
      required: [topic, format]
      properties:
        id: {type: string, description: Stable item id (generated as item-N when absent).}
        topic: {type: string}
        angle: {type: string}
        channel: {type: string}
        format: {type: string}
        publish_date: {type: string, description: YYYY-MM-DD or empty}
        notes: {type: string}
        done: {type: boolean}
    CampaignContentPlan:
      type: object
      required: [items]
      properties:
        summary: {type: string}
        themes: {type: array, items: {type: string}}
        items: {type: array, minItems: 1, maxItems: 200, items: {$ref: "#/components/schemas/CampaignPlanItem"}}
    CampaignMember:
      type: object
      required: [id, name, email]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        email: {type: string}
    Campaign:
      type: object
      required: [id, brand_id, name, goal, status, next_statuses, brief, start_date, end_date, content_plan, content_plan_approved_by, content_plan_approved_at, content_plan_proposal, content_plan_proposed_at, member_ids, created_by, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        brand_id: {$ref: "#/components/schemas/UUID"}
        name: {type: string}
        goal: {$ref: "#/components/schemas/CampaignGoal"}
        status: {$ref: "#/components/schemas/CampaignStatus"}
        next_statuses: {type: array, items: {$ref: "#/components/schemas/CampaignStatus"}}
        brief: {$ref: "#/components/schemas/CampaignBrief"}
        start_date: {type: [string, "null"], format: date}
        end_date: {type: [string, "null"], format: date}
        content_plan:
          description: Approved plan (ACS-037).
          oneOf:
            - {$ref: "#/components/schemas/CampaignContentPlan"}
            - {type: "null"}
        content_plan_approved_by: {type: [string, "null"], format: uuid}
        content_plan_approved_at: {type: [string, "null"], format: date-time}
        content_plan_proposal:
          description: Latest AI proposal awaiting approval (written by the content_plan job).
          oneOf:
            - {$ref: "#/components/schemas/CampaignContentPlan"}
            - {type: "null"}
        content_plan_proposed_at: {type: [string, "null"], format: date-time}
        member_ids: {type: array, items: {$ref: "#/components/schemas/UUID"}}
        created_by: {$ref: "#/components/schemas/UUID"}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    UploadPurpose:
      type: string
      enum: [brand_logo, reference_image, image_mask, video_source, music, document]
    FileKind: {type: string, enum: [image, video, audio, subtitle, document, other]}
    File:
      type: object
      required: [id, mime_type, size_bytes, kind, upload_status, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        original_name: {type: string}
        mime_type: {type: string}
        size_bytes: {type: integer}
        kind: {$ref: "#/components/schemas/FileKind"}
        upload_status: {type: string, enum: [pending, ready, rejected]}
        width: {type: [integer, "null"]}
        height: {type: [integer, "null"]}
        duration_ms: {type: [integer, "null"]}
        created_at: {type: string, format: date-time}
        url: {type: [string, "null"], description: Signed GET URL (≤ 15 min)}
        url_expires_at: {type: [string, "null"], format: date-time}
    RoleCode: {type: string, enum: [admin, marketing_lead, content_creator, reviewer]}
    Permission:
      type: string
      enum: [user.manage, provider.manage, provider.view, budget.manage, brand.manage, brand.view, campaign.manage, generate.run, asset.review, asset.download, usage.view, audit.view]
    UserStatus: {type: string, enum: [active, locked, disabled]}
    Me:
      type: object
      required: [id, email, name, roles, permissions]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        email: {type: string}
        name: {type: string}
        roles: {type: array, items: {$ref: "#/components/schemas/RoleCode"}}
        permissions: {type: array, items: {$ref: "#/components/schemas/Permission"}}
    User:
      type: object
      required: [id, email, name, status, roles, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        email: {type: string}
        name: {type: string}
        status: {$ref: "#/components/schemas/UserStatus"}
        roles: {type: array, items: {$ref: "#/components/schemas/RoleCode"}}
        locked_until: {type: [string, "null"], format: date-time}
        last_login_at: {type: [string, "null"], format: date-time}
        created_at: {type: string, format: date-time}
  responses:
    NoContent:
      description: No content
    BadRequest:
      description: VALIDATION_FAILED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: UNAUTHENTICATED / SESSION_EXPIRED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: FORBIDDEN / CSRF_INVALID
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: NOT_FOUND
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Conflict (INVALID_STATE_TRANSITION, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, CONFLICT)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    PayloadTooLarge:
      description: FILE_TOO_LARGE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unprocessable:
      description: CAPABILITY_NOT_SUPPORTED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Locked:
      description: ACCOUNT_LOCKED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooManyRequests:
      description: RATE_LIMITED / BUDGET_EXCEEDED / JOB_BUDGET_EXCEEDED / CONCURRENCY_LIMIT
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE / PRICING_MISSING
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BrandResponse:
      description: Brand
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: "#/components/schemas/Brand"}
              meta: {$ref: "#/components/schemas/Meta"}
    ProductResponse:
      description: Product
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: "#/components/schemas/Product"}
              meta: {$ref: "#/components/schemas/Meta"}
    CampaignResponse:
      description: Campaign detail
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                allOf:
                  - {$ref: "#/components/schemas/Campaign"}
                  - type: object
                    required: [members]
                    properties:
                      members: {type: array, items: {$ref: "#/components/schemas/CampaignMember"}}
              meta: {$ref: "#/components/schemas/Meta"}
