      tags: [campaigns]
      operationId: updateCampaign
      summary: Edit brief/header, change status, replace members (campaign.manage)
      description: >-
        Creators may edit only campaigns they created or are members of (403 otherwise); members are changed by the creator or Marketing Lead/Admin. Status follows SPEC-03 §2 (draft → in_progress ↔ review → completed → archived, any → archived); an invalid transition (e.g. draft → completed) or editing an archived campaign → 409 INVALID_STATE_TRANSITION.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: {type: string, maxLength: 200}
                goal: {$ref: "#/components/schemas/CampaignGoal"}
                brief: {$ref: "#/components/schemas/CampaignBrief"}
                start_date: {type: string, description: YYYY-MM-DD or empty to clear}
                end_date: {type: string, description: YYYY-MM-DD or empty to clear}
                status: {$ref: "#/components/schemas/CampaignStatus"}
                member_ids: {type: array, items: {$ref: "#/components/schemas/UUID"}}
      responses:
        "200": {$ref: "#/components/responses/CampaignResponse"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
