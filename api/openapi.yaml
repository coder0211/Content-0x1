  /files/upload-url:
    post:
      tags: [files]
      operationId: createUploadUrl
      summary: Create a pending file and a presigned PUT URL (expires ≤ 15 min)
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [filename, mime_type, size_bytes, purpose]
              properties:
                filename: {type: string, maxLength: 255}
                mime_type: {type: string, example: image/png}
                size_bytes: {type: integer, minimum: 1}
                purpose: {$ref: "#/components/schemas/UploadPurpose"}
      responses:
        "201":
          description: Upload ticket. PUT the bytes to `url` with exactly `headers`, then call /files/{id}/complete.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [file_id, url, method, headers, expires_at]
                    properties:
                      file_id: {$ref: "#/components/schemas/UUID"}
                      url: {type: string}
                      method: {type: string, enum: [PUT]}
                      headers: {type: object, additionalProperties: {type: string}}
                      expires_at: {type: string, format: date-time}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "413": {$ref: "#/components/responses/PayloadTooLarge"}
