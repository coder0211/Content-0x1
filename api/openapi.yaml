    post:
      tags: [images]
      operationId: estimateImages
      summary: Price an image request without creating a job (CostChip + over-budget banner)
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                campaign_id: {$ref: "#/components/schemas/ImageNullableUUID"}
                operation: {type: string, enum: [generate, edit, variation], default: generate}
                aspect_ratio: {$ref: "#/components/schemas/ImageAspectRatio"}
                quality: {$ref: "#/components/schemas/ImageQuality"}
                count: {type: integer, minimum: 1, maximum: 4, default: 1}
                model_code: {type: [string, "null"]}
      responses:
        "200":
          description: Estimate with remaining limits
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/ImageEstimate"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "422": {$ref: "#/components/responses/Unprocessable"}
  /images/generations:
    get:
      tags: [images]
      operationId: listImageBatches
      summary: Gallery grouped by request, newest first (own batches; a campaign's batches; or one asset's history)
      parameters:
        - {name: campaign_id, in: query, schema: {$ref: "#/components/schemas/UUID"}}
        - {name: asset_id, in: query, schema: {$ref: "#/components/schemas/UUID"}}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: Batches
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ImageBatch"}}
                  meta: {$ref: "#/components/schemas/ListMeta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
    post:
      tags: [images]
      operationId: generateImages
      summary: Prompt-to-image / image-to-image job (FR-IMG-01, 02) → 1 image asset with `count` files
      description: |
        Validates reference access (other campaign's file without membership → 404), MIME (png/jpeg/webp,
        else 415) and model capabilities (unsupported option → 422 CAPABILITY_NOT_SUPPORTED with
        `details: [{"field":"aspect_ratio","supported":[...]}]`; options are never changed silently).
        Then estimate → job + budget reservation → 202.
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ImageGenerationRequest"}
      responses:
        "202": {$ref: "#/components/responses/ImageJobAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /images/references:
    get:
      tags: [images]
      operationId: listImageReferences
      summary: Reference candidates — brand logo/reference images and recent generated images (signed URLs ≤ 15 min)
      parameters:
        - {name: campaign_id, in: query, schema: {$ref: "#/components/schemas/UUID"}}
        - {name: brand_id, in: query, schema: {$ref: "#/components/schemas/UUID"}}
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/ImageReference"}}
                  meta: {$ref: "#/components/schemas/ListMeta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /images/{assetId}/edits:
    parameters:
      - {name: assetId, in: path, required: true, schema: {$ref: "#/components/schemas/UUID"}}
    post:
      tags: [images]
      operationId: editImage
      summary: Edit one image of the asset by prompt → new version (FR-IMG-04)
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_id, prompt]
              properties:
                file_id: {$ref: "#/components/schemas/UUID"}
                prompt: {type: string, maxLength: 4000}
                mask_file_id: {$ref: "#/components/schemas/ImageNullableUUID"}
                quality: {$ref: "#/components/schemas/ImageQuality"}
                budget_override: {type: boolean, default: false}
      responses:
        "202": {$ref: "#/components/responses/ImageJobAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "415": {$ref: "#/components/responses/UnsupportedMediaType"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /images/{assetId}/variations:
    parameters:
      - {name: assetId, in: path, required: true, schema: {$ref: "#/components/schemas/UUID"}}
    post:
      tags: [images]
      operationId: varyImage
      summary: N variations of one image → new version; files carry parent_file_id (FR-IMG-04)
      parameters:
        - {$ref: "#/components/parameters/CSRFToken"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [file_id, count]
              properties:
                file_id: {$ref: "#/components/schemas/UUID"}
                count: {type: integer, minimum: 1, maximum: 4}
                prompt: {type: string, maxLength: 4000, description: Defaults to the version prompt}
                budget_override: {type: boolean, default: false}
      responses:
        "202": {$ref: "#/components/responses/ImageJobAccepted"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "422": {$ref: "#/components/responses/Unprocessable"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /jobs:
    get:
      tags: [jobs]
      operationId: listJobs
      summary: Jobs, newest first (own jobs; all jobs with provider.view)
      parameters:
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
        - name: status
          in: query
          description: Comma-separated statuses
          schema: {type: string, example: "queued,running"}
        - name: type
          in: query
          description: Comma-separated job types
          schema: {type: string, example: content_generation}
        - {name: campaign_id, in: query, schema: {$ref: "#/components/schemas/UUID"}}
        - name: created_by
          in: query
          description: Ignored without provider.view (forced to the caller)
          schema: {$ref: "#/components/schemas/UUID"}
        - {name: provider_code, in: query, schema: {type: string}}
        - {name: needs_reconciliation, in: query, schema: {type: boolean}}
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/JobSummary"}}
                  meta: {$ref: "#/components/schemas/ListMeta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /jobs/{id}:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    get:
      tags: [jobs]
      operationId: getJob
      summary: Job with steps, progress, result and error (owner or provider.view). Poll every 3s when SSE fails.
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/JobDetail"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /jobs/{id}/events:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    get:
      tags: [jobs]
      operationId: streamJobEvents
      summary: >-
        SSE stream (text/event-stream). Events `status`, `progress`, `step`, `done`; the first event is the current `status` snapshot; the stream ends after `done`. `: ping` every 15s.
      responses:
        "200":
          description: "Event stream; each `data:` line is JSON (JobStreamStatus, JobStreamStep or JobStreamDone)"
          content:
            text/event-stream:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "503": {$ref: "#/components/responses/ServiceUnavailable"}
  /jobs/{id}/history:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    get:
      tags: [jobs]
      operationId: listJobHistory
      summary: Append-only ai_job_events log of a job (oldest first, newest `limit` rows)
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {type: array, items: {$ref: "#/components/schemas/JobHistoryEvent"}}
                  meta: {$ref: "#/components/schemas/ListMeta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
  /jobs/{id}/cancel:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    post:
      tags: [jobs]
      operationId: cancelJob
      summary: >-
        Request cancellation (owner or admin). Jobs with nothing in flight are cancelled at once; otherwise the worker cancels after the running step (provider.Cancel for waiting video steps). Finished → 409.
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "202":
          description: Cancellation accepted
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: object
                    required: [job_id, status, cancel_requested]
                    properties:
                      job_id: {$ref: "#/components/schemas/UUID"}
                      status: {$ref: "#/components/schemas/JobStatus"}
                      cancel_requested: {type: boolean}
                  meta: {$ref: "#/components/schemas/Meta"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
  /jobs/{id}/retry:
    parameters: [{$ref: "#/components/parameters/PathID"}]
    post:
      tags: [jobs]
      operationId: retryJob
      summary: >-
        Re-run the failed steps of a failed job (owner or admin; succeeded steps keep their output). Only retryable errors unless an admin sends force=true. Creates a new budget reservation (429 when over budget).
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force: {type: boolean, default: false}
      responses:
        "202":
          description: Job re-queued
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data: {$ref: "#/components/schemas/JobAccepted"}
                  meta: {$ref: "#/components/schemas/Meta"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
