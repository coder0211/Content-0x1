        file_id: {$ref: "#/components/schemas/UUID"}
        source: {type: string, enum: [brand, library]}
        label: {type: string}
        mime_type: {type: string}
        width: {type: integer}
        height: {type: integer}
        url: {type: string}
        thumbnail_url: {type: string}
        url_expires_at: {type: string, format: date-time}
    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]
    JobStepStatus:
      type: string
      enum: [pending, queued, running, waiting_provider, succeeded, failed, cancelled, skipped]
    JobType:
      type: string
      enum:
        - content_generation
        - content_rewrite
        - content_transform
        - content_plan
        - image_generation
        - image_edit
        - image_prompt_suggest
        - video_storyboard
        - video_production
        - video_scene_regenerate
        - video_render
    JobCost:
      type: object
      required: [estimate, actual, source, currency]
      properties:
        estimate: {type: [number, "null"]}
        actual: {type: [number, "null"]}
        source: {type: [string, "null"], enum: [provider_reported, calculated, estimated, null]}
        currency: {type: string, example: USD}
    JobError:
      type: object
      required: [code, message]
      properties:
        code: {type: string, example: PROVIDER_CONTENT_POLICY}
        message: {type: string, description: Vietnamese, user-facing: ''}
    JobSummary:
      type: object
      required:
        - id
        - job_type
        - status
        - progress
        - created_by
        - campaign_id
        - asset_id
        - provider_code
        - model_code
        - cost
        - error
        - cancel_requested
        - needs_reconciliation
        - created_at
        - started_at
        - finished_at
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        job_type: {$ref: "#/components/schemas/JobType"}
        status: {$ref: "#/components/schemas/JobStatus"}
        progress: {type: integer, minimum: 0, maximum: 100}
        created_by: {$ref: "#/components/schemas/UUID"}
        campaign_id: {type: [string, "null"], format: uuid}
        asset_id: {type: [string, "null"], format: uuid}
        provider_code: {type: [string, "null"]}
        model_code: {type: [string, "null"]}
        cost: {$ref: "#/components/schemas/JobCost"}
        error:
          oneOf:
            - {$ref: "#/components/schemas/JobError"}
            - {type: "null"}
        cancel_requested: {type: boolean}
        needs_reconciliation: {type: boolean}
        created_at: {type: string, format: date-time}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    JobStep:
      type: object
      required: [id, step_key, step_type, status, attempt_count, error_kind, error_message, output, started_at, finished_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        step_key: {type: string, example: "scene_generation:2"}
        step_type: {type: string, example: scene_generation}
        status: {$ref: "#/components/schemas/JobStepStatus"}
        attempt_count: {type: integer}
        error_kind:
          type: [string, "null"]
          description: Transient, RateLimited, InvalidRequest, ContentPolicy, Auth, Unknown, Timeout, Permanent, Domain, Internal, LeaseExpired
        error_message: {type: [string, "null"], description: Internal detail; only sent to provider.view}
        output: {description: Step output JSON (null until the step produced one)}
        started_at: {type: [string, "null"], format: date-time}
        finished_at: {type: [string, "null"], format: date-time}
    JobDetail:
      allOf:
        - {$ref: "#/components/schemas/JobSummary"}
        - type: object
          required: [brand_version_id, prompt_template_id, request, result, steps]
          properties:
            brand_version_id: {type: [string, "null"], format: uuid}
            prompt_template_id: {type: [string, "null"], format: uuid}
            request: {type: object, additionalProperties: true}
            result:
              description: "e.g. {\"asset_ids\": [...]} once succeeded; null before"
              type: [object, "null"]
              additionalProperties: true
            steps: {type: array, items: {$ref: "#/components/schemas/JobStep"}}
    JobHistoryEvent:
      type: object
      required: [id, step_id, event_type, payload, created_at]
      properties:
        id: {type: integer, format: int64}
        step_id: {type: [string, "null"], format: uuid}
        event_type:
          type: string
          description: created, status_changed, step_status_changed, retry_scheduled, provider_error, cancel_requested, retried, lease_expired, concurrency_wait, reconciled
        payload: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    JobStreamStatus:
      description: "SSE `status` / `progress` data"
      type: object
      required: [job_id, status, progress]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        status: {$ref: "#/components/schemas/JobStatus"}
        progress: {type: integer}
        cancel_requested: {type: boolean}
        step_key: {type: string}
        step_progress: {type: integer}
        message: {type: string}
    JobStreamStep:
      description: "SSE `step` data"
      type: object
      required: [job_id, step_key, status, attempt_count]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        step_key: {type: string}
        status: {$ref: "#/components/schemas/JobStepStatus"}
        attempt_count: {type: integer}
        error_kind: {type: string}
    JobStreamDone:
      description: "SSE `done` data (last event)"
      type: object
      required: [job_id, status, result]
      properties:
        job_id: {$ref: "#/components/schemas/UUID"}
        status: {$ref: "#/components/schemas/JobStatus"}
        result: {type: [object, "null"], additionalProperties: true}
        error: {$ref: "#/components/schemas/JobError"}
    AIKind: {type: string, enum: [text, image, video, voice]}
    AIProviderStatus: {type: string, enum: [active, disabled]}
    AIModelStatus: {type: string, enum: [active, disabled]}
    PromptTemplateStatus: {type: string, enum: [draft, active, retired]}
    AICapabilities:
      type: object
      additionalProperties: true
      description: "Model capability map (ports.Capabilities), e.g. aspect_ratios, sizes, max_duration_sec, voices, structured_output"
    AIProvider:
      type: object
      required: [id, code, name, kinds, status, secret_ref, secret_configured, adapter_available, config_json, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        code: {type: string, example: anthropic}
        name: {type: string}
        kinds: {type: array, items: {$ref: "#/components/schemas/AIKind"}}
        status: {$ref: "#/components/schemas/AIProviderStatus"}
        secret_ref: {type: string}
        secret_configured: {type: boolean}
        adapter_available: {type: boolean}
        config_json: {type: object, additionalProperties: true}
        updated_at: {type: string, format: date-time}
    AIModel:
      type: object
      required: [id, provider_id, provider_code, provider_status, model_code, kind, capabilities, concurrency_limit, is_default, status, adapter_available, usable]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        provider_id: {$ref: "#/components/schemas/UUID"}
        provider_code: {type: string}
        provider_status: {$ref: "#/components/schemas/AIProviderStatus"}
        model_code: {type: string}
        kind: {$ref: "#/components/schemas/AIKind"}
        capabilities: {$ref: "#/components/schemas/AICapabilities"}
        concurrency_limit: {type: integer}
        is_default: {type: boolean}
        status: {$ref: "#/components/schemas/AIModelStatus"}
        adapter_available: {type: boolean}
        usable: {type: boolean}
    AIPriceItem:
      type: object
      required: [unit, unit_price]
      properties:
        unit: {type: string, example: input_token}
        unit_price: {type: string, description: "Decimal as string", example: "0.000003"}
    AIPricingVersion:
      type: object
      required: [pricing_version, currency, effective_from, effective_to, is_current, items]
      properties:
        pricing_version: {type: string}
        currency: {type: string}
        effective_from: {type: string, format: date-time}
        effective_to: {type: [string, "null"], format: date-time}
        is_current: {type: boolean}
        items: {type: array, items: {$ref: "#/components/schemas/AIPriceItem"}}
    PromptTemplate:
      type: object
      required: [id, code, version, status, system_prompt, user_template, output_schema, created_by, created_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        code: {type: string}
        version: {type: integer}
        status: {$ref: "#/components/schemas/PromptTemplateStatus"}
        system_prompt: {type: string}
        user_template: {type: string}
        output_schema: {type: [object, "null"], additionalProperties: true}
        created_by: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        created_at: {type: string, format: date-time}
    VideoPreset:
      type: string
      enum: [social_vertical, square, landscape]
      description: "social_vertical 9:16 1080×1920, square 1:1 1080×1080, landscape 16:9 1920×1080 (30 fps, H.264/AAC)"
    VideoStage: {type: string, enum: [storyboarding, editing, producing, ready, failed]}
    VideoSceneStatus: {type: string, enum: [draft, generating, ready, failed]}
    VideoVoiceover:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        language: {type: string, default: vi}
        voice_id: {type: [string, "null"]}
        mode: {type: [string, "null"], enum: [per_scene, whole, null], default: per_scene}
    VideoSubtitles:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        language: {type: string, default: vi}
        style: {type: string, enum: [burn_in, soft], default: burn_in}
    VideoMusic:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled: {type: boolean}
        track_brand_asset_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}], description: "Brand music asset with a valid license (422 MUSIC_NOT_LICENSED otherwise)"}
    VideoCreateRequest:
      type: object
      additionalProperties: false
      required: [preset]
      properties:
        campaign_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        brand_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}], description: Required without campaign_id}
        title: {type: [string, "null"], maxLength: 200}
        source:
          type: object
          additionalProperties: false
          properties:
            type: {type: string, enum: [prompt, image, script]}
            file_ids: {type: array, maxItems: 10, items: {$ref: "#/components/schemas/UUID"}}
        prompt: {type: [string, "null"], maxLength: 4000}
        script_from_asset_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}], description: Content asset whose script seeds the storyboard}
        preset: {$ref: "#/components/schemas/VideoPreset"}
        aspect_ratio: {type: [string, "null"], enum: ["9:16", "1:1", "16:9", null]}
        target_duration_seconds: {type: integer, minimum: 4, maximum: 60, default: 20}
        resolution: {type: [string, "null"], enum: [1080p, null]}
        voiceover: {$ref: "#/components/schemas/VideoVoiceover"}
        subtitles: {$ref: "#/components/schemas/VideoSubtitles"}
        music: {$ref: "#/components/schemas/VideoMusic"}
    VideoJobAccepted:
      allOf:
        - {$ref: "#/components/schemas/JobAccepted"}
        - type: object
          required: [asset_id]
          properties:
            asset_id: {$ref: "#/components/schemas/UUID"}
    VideoSceneInput:
      type: object
      additionalProperties: false
      required: [duration_ms, visual_prompt]
      properties:
        id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}], description: "null = new scene"}
        duration_ms: {type: integer, minimum: 2000, maximum: 8000}
        visual_prompt: {type: string, maxLength: 1000}
        narration: {type: [string, "null"], maxLength: 1000}
        subtitle_text: {type: [string, "null"], maxLength: 1000}
        source_file_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
    VideoScene:
      type: object
      required: [id, sequence_no, duration_ms, visual_prompt, narration, subtitle_text, source_file_id, clip_file_id, status, attempt_count, last_error, preview_url, thumbnail_url]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        sequence_no: {type: integer}
        duration_ms: {type: integer}
        visual_prompt: {type: string}
        narration: {type: [string, "null"]}
        subtitle_text: {type: [string, "null"]}
        source_file_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        clip_file_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        status: {$ref: "#/components/schemas/VideoSceneStatus"}
        attempt_count: {type: integer}
        last_error: {type: [string, "null"]}
        preview_url: {type: [string, "null"], description: Signed clip URL (≤ 15 min)}
        thumbnail_url: {type: [string, "null"]}
    VideoJobStep:
      type: object
      required: [step_key, step_type, status, attempt_count, error_kind, error_message]
      properties:
        step_key: {type: string, example: "scene_generation:3"}
        step_type: {type: string}
        status: {type: string, enum: [pending, queued, running, waiting_provider, succeeded, failed, cancelled, skipped]}
        attempt_count: {type: integer}
        error_kind: {type: [string, "null"]}
        error_message: {type: [string, "null"]}
    VideoJob:
      type: object
      required: [id, job_type, status, progress, steps, error_code, error_message]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        job_type: {type: string, enum: [video_storyboard, video_production, video_scene_regenerate, video_render]}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        progress: {type: integer, minimum: 0, maximum: 100}
        steps: {type: array, items: {$ref: "#/components/schemas/VideoJobStep"}}
        error_code: {type: [string, "null"]}
        error_message: {type: [string, "null"]}
    VideoOutput:
      type: object
      required: [file_id, url, thumbnail_url, duration_ms, version_no, subtitle_file_id, subtitle_url]
      properties:
        file_id: {$ref: "#/components/schemas/UUID"}
        url: {type: string, description: Signed MP4 URL (≤ 15 min); empty in list responses}
        thumbnail_url: {type: [string, "null"]}
        duration_ms: {type: integer}
        version_no: {type: integer}
        subtitle_file_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        subtitle_url: {type: [string, "null"]}
    VideoSettings:
      type: object
      required: [preset, aspect_ratio, width, height, fps, target_duration_seconds, resolution, voiceover, subtitles, music, source]
      properties:
        preset: {$ref: "#/components/schemas/VideoPreset"}
        aspect_ratio: {type: string}
        width: {type: integer}
        height: {type: integer}
        fps: {type: integer}
        target_duration_seconds: {type: integer}
        resolution: {type: string}
        voiceover: {$ref: "#/components/schemas/VideoVoiceover"}
        subtitles: {$ref: "#/components/schemas/VideoSubtitles"}
        music: {$ref: "#/components/schemas/VideoMusic"}
        source:
          type: object
          required: [type, file_ids]
          properties:
            type: {type: string, enum: [prompt, image, script]}
            file_ids: {type: array, items: {$ref: "#/components/schemas/UUID"}}
    VideoProject:
      type: object
      required: [id, title, status, stage, campaign_id, brand_id, created_by, prompt, script, settings, scenes, total_duration_ms, limits, output, current_job, version_no, created_at, updated_at]
      properties:
        id: {$ref: "#/components/schemas/UUID"}
        title: {type: string}
        status: {type: string, description: content_assets.status}
        stage: {$ref: "#/components/schemas/VideoStage"}
        campaign_id: {oneOf: [{$ref: "#/components/schemas/UUID"}, {type: "null"}]}
        brand_id: {$ref: "#/components/schemas/UUID"}
        created_by: {$ref: "#/components/schemas/UUID"}
        prompt: {type: [string, "null"]}
        script: {type: [string, "null"]}
        settings: {$ref: "#/components/schemas/VideoSettings"}
        scenes: {type: array, items: {$ref: "#/components/schemas/VideoScene"}}
        total_duration_ms: {type: integer}
        limits:
          type: object
          required: [max_total_seconds, max_scenes, min_scene_ms, max_scene_ms]
          properties:
            max_total_seconds: {type: integer, example: 60}
            max_scenes: {type: integer, example: 10}
            min_scene_ms: {type: integer, example: 2000}
            max_scene_ms: {type: integer, example: 8000}
        output: {oneOf: [{$ref: "#/components/schemas/VideoOutput"}, {type: "null"}]}
        current_job: {oneOf: [{$ref: "#/components/schemas/VideoJob"}, {type: "null"}]}
        version_no: {type: integer}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    VideoEstimate:
      type: object
      required: [scene_count, total_clip_seconds, breakdown, total, limits, requires_override, blocked, violations]
      properties:
        scene_count: {type: integer}
        total_clip_seconds: {type: integer, description: Seconds of clips to generate (ready scenes are reused)}
        breakdown:
          type: array
          items:
            type: object
            required: [item, provider, model, units, unit, unit_price, amount]
            properties:
              item: {type: string, example: scene_clips}
              provider: {type: [string, "null"]}
              model: {type: [string, "null"]}
              units: {type: number}
              unit: {type: string, example: video_second_1080p}
              unit_price: {type: number}
              amount: {type: number}
        total: {$ref: "#/components/schemas/Money"}
        limits:
          type: object
          required: [per_job_limit, campaign_remaining, global_remaining]
          properties:
            per_job_limit: {type: number}
            campaign_remaining: {type: [number, "null"]}
            global_remaining: {type: number}
        requires_override: {type: boolean, description: Estimate exceeds the per-job limit (Lead/Admin override needed)}
        blocked: {type: boolean, description: Not enough global/campaign budget left}
        violations: {type: array, items: {$ref: "#/components/schemas/ErrorDetail"}, description: OQ-07 storyboard issues; production is refused while any exists}
  responses:
    NoContent:
      description: No content
    BadRequest:
      description: VALIDATION_FAILED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unauthorized:
      description: UNAUTHENTICATED / SESSION_EXPIRED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Forbidden:
      description: FORBIDDEN / CSRF_INVALID
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    NotFound:
      description: NOT_FOUND
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Conflict:
      description: Conflict (INVALID_STATE_TRANSITION, IDEMPOTENCY_CONFLICT, VERSION_CONFLICT, CONFLICT)
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    PayloadTooLarge:
      description: FILE_TOO_LARGE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    UnsupportedMediaType:
      description: UNSUPPORTED_MEDIA_TYPE
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Unprocessable:
      description: CAPABILITY_NOT_SUPPORTED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    Locked:
      description: ACCOUNT_LOCKED
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    TooManyRequests:
      description: RATE_LIMITED / BUDGET_EXCEEDED / JOB_BUDGET_EXCEEDED / CONCURRENCY_LIMIT
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    ServiceUnavailable:
      description: SERVICE_UNAVAILABLE / PRICING_MISSING
      content: {application/json: {schema: {$ref: "#/components/schemas/Error"}}}
    BrandResponse:
      description: Brand
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: "#/components/schemas/Brand"}
              meta: {$ref: "#/components/schemas/Meta"}
    ProductResponse:
      description: Product
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: "#/components/schemas/Product"}
              meta: {$ref: "#/components/schemas/Meta"}
    CampaignResponse:
      description: Campaign detail
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data:
                allOf:
                  - {$ref: "#/components/schemas/Campaign"}
                  - type: object
                    required: [members]
                    properties:
                      members: {type: array, items: {$ref: "#/components/schemas/CampaignMember"}}
              meta: {$ref: "#/components/schemas/Meta"}
    ImageJobAccepted:
      description: Job created (or the existing job for a replayed Idempotency-Key)
      content:
        application/json:
          schema:
            type: object
            required: [data, meta]
            properties:
              data: {$ref: "#/components/schemas/JobAccepted"}
              meta: {$ref: "#/components/schemas/Meta"}
