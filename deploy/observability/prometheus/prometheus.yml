# Prometheus for AI Content Studio (ACS-104, SPEC-02 §8).
# Scrapes the API's /metrics over the private compose network. /metrics is
# never routed by the public nginx (see deploy/staging/nginx.conf).
#
# Workers (cmd/worker) do not expose an HTTP listener yet, so ai_* metrics
# recorded inside worker processes are not scraped. When a worker metrics
# listener is added (suggested env: WORKER_METRICS_ADDR=:9091), uncomment the
# `acs-worker` job below.
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    project: acs

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [] # e.g. ["alertmanager:9093"] — wire to the on-call channel

scrape_configs:
  - job_name: acs-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8080"]
        labels: { service: api }

  # - job_name: acs-worker
  #   metrics_path: /metrics
  #   static_configs:
  #     - targets: ["worker:9091", "render:9091"]
  #       labels: { service: worker }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
