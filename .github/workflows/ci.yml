# CI (ACS-002): fails on lint/test failures or layer-dependency violations.
# Target: < 10 minutes. Jobs run in parallel.
name: ci

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  GOLANGCI_VERSION: v2.15.0
  SQLC_VERSION: v1.30.0

jobs:
  go-lint:
    name: Go · lint (golangci + depguard + arch test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.sum }
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal migrations tools)" || { gofmt -l cmd internal migrations tools; exit 1; }
      - name: go vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_VERSION }}
          working-directory: api
      - name: Architecture test (SPEC-06 R1/R3/R4, §2.5)
        run: go test ./internal/archtest/
      - name: Generated code is up to date (sqlc + openapi)
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION} generate
          go run ./tools/openapi-bundle
          git diff --exit-code -- . || { echo "::error::Run 'make gen' and commit the result"; exit 1; }

  go-test:
    name: Go · test (unit + testcontainers integration)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.sum }
      - name: Test (Docker is available on the runner, so integration tests run)
        run: |
          go test -race -count=1 -coverprofile=coverage.out \
            ./... ./internal/modules/_template ./internal/modules/_template/domain \
            ./internal/modules/_template/usecase ./internal/modules/_template/adapter/http

  migrations:
    name: Go · migrations up/down on an empty DB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: acs, POSTGRES_PASSWORD: acs, POSTGRES_DB: acs }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acs" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://acs:acs@localhost:5432/acs?sslmode=disable
    defaults: { run: { working-directory: api } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}", cache-dependency-path: api/go.sum }
      - run: go run ./cmd/acs migrate up
      - run: go run ./cmd/acs migrate down-to 0
      - run: go run ./cmd/acs migrate up
      - run: go run ./cmd/acs migrate status

  web:
    name: Web · lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: Docker · build images
    runs-on: ubuntu-latest
    needs: [go-lint, go-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile.api, push: false, tags: "acs-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - uses: docker/build-push-action@v6
        with: { context: ., file: deploy/Dockerfile.worker, push: false, tags: "acs-worker:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
